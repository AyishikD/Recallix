[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recallix-haystack"
version = "0.1.0"
description = "Recallix as the memory store of Haystack agents: self-hosted, no LLM calls for memory, says when it has no record."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["haystack-ai>=2.18", "recallix>=0.2.5"]

[project.optional-dependencies]
agent = ["haystack-experimental>=0.15"]

[project.urls]
Homepage = "https://github.com/AyishikD/Recallix/tree/main/integrations/haystack"

[tool.hatch.build.targets.wheel]
packages = ["src/recallix_haystack"]
