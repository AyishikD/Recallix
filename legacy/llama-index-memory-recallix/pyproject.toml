[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-memory-recallix"
version = "0.2.0"
description = "Renamed to llama-index-memory-recallic. This release installs it and keeps old imports working."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["llama-index-memory-recallic>=0.2.0"]

[project.urls]
Homepage = "https://www.recallic.com"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]
