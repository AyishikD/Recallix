[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recallix"
version = "0.3.0"
description = "Renamed to recallic. This release installs it and keeps old imports working."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["recallic>=0.3.0"]

[project.urls]
Homepage = "https://www.recallic.com"

[tool.hatch.build.targets.wheel]
packages = ["src/recallix"]
