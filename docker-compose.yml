# Self-hosted Recallic: one container (vector engine + API), data in a named volume.
#   docker compose up -d
#   docker compose logs recallic | grep -A2 "admin API key"     # printed once, on first start
#   curl localhost:8000/health                                 # {"status": "ok", "api": "ok", "engine": "ok"}
#   docker compose ps                                          # STATUS shows (healthy) once the models have loaded
services:
  recallic:
    build: .
    image: recallic:latest
    ports:
      - "127.0.0.1:8000:8000"     # loopback only; put a TLS reverse proxy in front to expose it
    volumes:
      - recallic-data:/data
    environment:
      # browser origins allowed to call the API (e.g. your dashboard)
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    restart: unless-stopped
volumes:
  recallic-data:
