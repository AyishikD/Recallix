[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recallix"
version = "0.2.3"
description = "Python client and MCP server for Recallix, an LLM-free memory layer for AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.33.0"]
license = { text = "Apache-2.0" }
keywords = ["memory", "ai-agents", "llm", "mcp", "rag"]

[project.urls]
Homepage = "https://github.com/AyishikD/Recallix"
Source = "https://github.com/AyishikD/Recallix"

[project.scripts]
recallix-mcp = "recallix.mcp_server:main"

[tool.setuptools]
packages = ["recallix"]
