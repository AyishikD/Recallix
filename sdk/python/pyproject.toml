[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryos"
version = "0.2.0"
description = "Python client for the Recallix memory API"
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["memoryos"]
