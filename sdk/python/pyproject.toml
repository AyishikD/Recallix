[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recallic"
version = "0.3.0"
description = "Python client and MCP server for Recallic, an LLM-free memory layer for AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.33.0"]
license = { text = "Apache-2.0" }
keywords = ["memory", "ai-agents", "llm", "mcp", "rag"]

[project.urls]
Homepage = "https://github.com/Recallic/Recallic"
Source = "https://github.com/Recallic/Recallic"

[project.scripts]
recallic-mcp = "recallic.mcp_server:main"
recallix-mcp = "recallic.mcp_server:main"  # name before the rename; old MCP client configs keep working

[tool.setuptools]
packages = ["recallic"]
