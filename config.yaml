# ============================================================================
# Recallic Configuration
# ============================================================================
# This is the single source of truth for all model and infrastructure settings.
# Edit this file to switch between providers, models, or tune performance.
#
# MODELS:
#   - Set "provider" to choose your LLM backend.
#   - Under each provider, specify the model names you want to use.
#   - You can use ANY Ollama model (e.g. "phi3", "gemma2:2b", "codellama")
#     or ANY API provider by adding your key below.
#
# To add a new Ollama model, just change the name:
#   smart_model: "deepseek-r1:8b"
#
# To switch to an API provider, change provider and fill in the key:
#   provider: "openai"
# ============================================================================

models:
  # The memory pipeline (store/recall/workers) makes NO LLM calls; it only needs
  # embeddings. `provider` is used only by scripts that drive LLM agents
  # (e.g. examples/multi_agent_handover.py).
  # Which provider to use: "ollama", "openai", "anthropic", "groq", "nvidia", or "custom"
  provider: "nvidia"
  # Embeddings: "local" (in-process sentence-transformers, fully offline; needs requirements-local.txt),
  # "ollama", or any OpenAI-compatible provider below. The shipped ranking, answer-check and trust
  # fits were made with the local default model; with another model, refit (eval/README.md).
  # Env RECALLIC_EMBEDDING_PROVIDER overrides.
  embedding_provider: "local"

  # --- Local (in-process, offline) ---
  local:
    embedding_model: "BAAI/bge-small-en-v1.5"   # 384-d, ~130 MB; chosen on dev data (eval/results/embedder_comparison)

  # --- Ollama (Local) ---
  # Any model pulled via `ollama pull <name>` works here.
  # Audited defaults: llama3.1:8b, mistral:latest, mxbai-embed-large
  ollama:
    base_url: "http://localhost:11434"
    fast_model: "mistral:latest"        # Used for: compression, summarization, intent detection
    smart_model: "llama3.1:8b"          # Used for: reasoning, reflection, schema discovery
    embedding_model: "mxbai-embed-large" # Used for: 128D vector embeddings

  # --- OpenAI (API) ---
  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    fast_model: "gpt-4o-mini"
    smart_model: "gpt-4o"
    embedding_model: "text-embedding-3-small"

  # --- Anthropic (API) ---
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com"
    fast_model: "claude-3-5-haiku-20241022"
    smart_model: "claude-sonnet-4-20250514"

  # --- Groq (API) ---
  groq:
    api_key: "${GROQ_API_KEY}"
    base_url: "https://api.groq.com/openai/v1"
    fast_model: "llama-3.1-8b-instant"
    smart_model: "llama-3.3-70b-versatile"

  # --- NVIDIA (API) ---
  nvidia:
    api_key: "${NVIDIA_API_KEY}"
    base_url: "https://integrate.api.nvidia.com/v1"
    fast_model: "nvidia/nemotron-nano-12b-v2-vl"
    smart_model: "nvidia/nvidia-nemotron-nano-9b-v2"
    embedding_model: "nvidia/nv-embedqa-e5-v5"

  # --- Custom (Any OpenAI-compatible API) ---
  custom:
    api_key: ""
    base_url: ""                         # e.g. "https://your-server.com/v1"
    fast_model: ""
    smart_model: ""
    embedding_model: ""

# ============================================================================
# Storage (SQLite databases, API key hashes, learned model files)
# ============================================================================
storage:
  root: "backend/storage"   # relative to the project root; env RECALLIC_STORAGE_ROOT overrides

# ============================================================================
# Vector engine (C++ service, backend/infra_cpp)
# The shared secret is NOT configured here: set RECALLIC_INTERNAL_KEY in the
# environment / .env (python -m backend.tools.setup_env creates one).
# ============================================================================
engine:
  url: "http://127.0.0.1:8080"   # env RECALLIC_ENGINE_URL overrides
  timeout_seconds: 10
  bulk_batch_size: 1000          # vectors per request when rebuilding an index

# ============================================================================
# HNSW Index Parameters (pushed to the engine at startup; changing M or
# ef_construction triggers a rebuild of every index on next start)
# ============================================================================
hnsw:
  M: 16                   # Max neighbors per node per layer
  ef_construction: 100    # Construction beam width (higher = better graph, slower build)
  ef_search: 50           # Search beam width (higher = better recall, slower search)

# ============================================================================
# Memory tiers
# ============================================================================
memory:
  # Relative dates resolved at store time against the memory's timestamp: "yesterday" said on 8 May 2023 is
  # kept as "yesterday [7 May 2023]" for the answer check and in recall results (content_resolved). Rules only;
  # vague words ("lately", "recently") are left alone (features/dates.py). LoCoMo dev (real session dates):
  # the answer check's answer matches the gold on time questions 13/156 -> 54/156; time-question recall@10
  # 0.769 -> 0.782; declines unchanged (eval/results/date_resolution/).
  resolve_dates:
    enabled: true
  long_term_min_importance: 8.0   # importance (1-10) at which a memory is promoted to long-term
  decay_unit_hours: 24            # time unit of the Ebbinghaus stability for long-term facts
  sensory_ttl_seconds: 60
  sensory_size: 10
  working_window: 15              # messages kept in working memory per user

# ============================================================================
# Recall
# ============================================================================
recall:
  # How readily recall answers (backend/brain/features/modes.py); also per request ("mode" in /memory/recall).
  #   balanced  default: the answer check as configured.
  #   cautious  also verify every answer with answer_check.verify. LoCoMo test (held out): trick questions declined
  #             66 -> 122 of 209, real questions wrongly declined 70 -> 224 of 772; LongMemEval_S 16 -> 20 of 30
  #             and 78 -> 115 of 470. For high-stakes use where "I don't know" is far better than a wrong answer.
  #   helpful   also rescue declined counting / ordering / time questions (aggregation_check, rescue). LongMemEval_S
  #             wrongly declined 78 -> 55 of 470, unanswerable declined 16 -> 17 of 30; LoCoMo dev 60 -> 56 of 760.
  mode: balanced
  # helpful also lowers the answer check's threshold by this much (balanced and cautious never do).
  helpful_threshold_offset: 0.8
  candidate_pool: 200        # max candidates from each of lexical and vector search
  backfill_per_query: 50     # max legacy rows embedded lazily per query
  # Abstention: recall returns nothing when the best match's relevance is below a threshold.
  # The fitter sets it so that at most this share of answerable dev questions is refused
  # (a wrongly refused question is treated as costlier than a missed trap; raise it to refuse more).
  max_false_abstain_rate: 0.05
  # Answer-level check (needs requirements-local.txt): a small extractive QA model trained on
  # SQuAD 2.0 reads the served memories; recall abstains if none of them contains an answer.
  # No LLM. threshold: null = value chosen on dev data for this model (answer_check.default.json),
  # else the model's own answer/no-answer boundary.
  answer_check:
    enabled: true
    model: "deepset/roberta-base-squad2"   # chosen on dev data (eval/run_eval.py --fit-answer-check); must match answer_check.default.json
    max_length: 384
    stride: 128
    device: null           # null: a GPU if there is one (CUDA, then Apple), else the CPU; or "cpu" / "cuda" / "mps"
    max_answer_tokens: 30
    threshold: null
    rerank: true       # serve memories in which an answer was found first (dev: LoCoMo hit@1 0.29 -> 0.37)
    # Read all-lowercase (texting-style) memories with sentence case restored; text with any capital
    # is read unchanged (features/answer_check.py restore_case). OFF by default (owner's decision:
    # wrong answers cost more than refusals). Gemini batches 1-2 (development): right memory recognised
    # 44/50 -> 49/50. Unseen batch 3: +1 answered, but traps wrongly answered 0/10 -> 2/10.
    restore_case: false
    # Calculation questions ("how many times ...", "how many months passed between ...", "how long
    # has it been since ..."): the answer is a count or a difference across memories, never a phrase
    # inside one, so the reader cannot confirm it and used to decline. For these the relevance
    # threshold decides instead, and debug.answer_check.needs_calculation says the answer still has
    # to be worked out from the memories. "How many employees ..." / "how much rent ..." are single
    # facts and still go to the reader. Measured (eval/results/retrieval_fixes): answerable questions
    # wrongly declined 52 -> 49 of 760 on LoCoMo dev and 9 -> 5 of 123 on conv-44; trap questions
    # declined unchanged on LoCoMo dev (56/237), the Gemini batches (28/30) and our dev set (8/8).
    calculation_questions: true
    # Answer verification (features/answer_verify.py): a QNLI cross-encoder (qnli-electra-base, 110M, Apache 2.0)
    # checks that a memory the reader answered from actually answers the question ("<speaker> said: <message>").
    # Catches trick answers such as "your new hair color looks amazing" for "Why did Joanna choose her hair color?".
    # Threshold chosen on LoCoMo dev answered questions: 0.001 keeps 350 of 379 answers from evidence and
    # declines 53 of 160 answered trick questions. Off until confirmed on held-out data.
    verify:
      enabled: false
      model: cross-encoder/qnli-electra-base
      threshold: 0.001
    # Answers that are not statements about the asked person: the reader's span lies only inside a
    # question ("Wow, that looks amazing! What inspired it?"), or is a speaker's name used to address
    # them ("Thanks, Melanie!"), or comes from the asked person's own message that speaks only to the
    # listener ("you/your", no "I/my": it is about the listener). Such a memory does not count as
    # answering; the reader moves on to the next one. Measured on LoCoMo dev
    # (eval/results/retrieval_fixes): trap questions declined 56 -> 77 of 237; answerable questions
    # declined 49 -> 60 of 760, of which 9 had accepted a non-answer ("Melanie", "reach a goal") and
    # 2 lost a right one; our dev set and the Gemini batches unchanged.
    reject_non_statements: true
    # Read each memory without clauses whose subject is another person the question does not ask
    # about ("roommate liam failed his organic chemistry midterm" cannot answer "What is my major?").
    # A memory entirely about someone else then cannot answer (memory/updates.py without_other_people).
    other_people:
      enabled: true
    # "Who said what": when a question names one of the speakers, a memory counts as answering
    # only if the reader finds the answer more strongly for that person than for every other
    # speaker (contrast > min_contrast). LoCoMo dev (999 questions): adversarial questions
    # declined 23.2% -> 28.3%, answerable wrongly declined 7.48% -> 7.61%, recall@10 unchanged.
    subject_contrast:
      enabled: true
      min_contrast: 0.0      # principled default: support the asked person more than anyone else
      max_alternatives: 3    # other speakers to compare against (one reader pass each)
  # Aggregation check (features/aggregation_check.py; needs requirements-local.txt). Counting, ordering and
  # time-between questions ("How many weddings did I attend?", "Which came first, A or B?", "How many days
  # after X did Y happen?") have no answer phrase inside one memory, so the extractive answer check cannot
  # judge them. Instead the question is rewritten into the events it takes for granted ("I did attend
  # weddings.") and an entailment model (NLI cross-encoder, Apache 2.0, no LLM) checks that some ranked memory
  # supports each one. All supported: the memories are served and debug.aggregation_check.needs_calculation
  # says the answer must be worked out. One unsupported (never mentioned, only planned, someone else's):
  # decline. Other questions are untouched. When on, it replaces answer_check.calculation_questions for the
  # questions it recognises.
  # mode: rescue (default) only turns a decline of the usual answer check into an answer when every event is
  # supported; it never declines anything itself. On held-out LongMemEval_S (eval/results/aggregation_check):
  # answerable wrongly declined 78 -> 55 of 470, unanswerable declined unchanged (16 of 30); on our own sets it
  # also answers a few traps the usual path declined, so it is opt-in. mode: decide lets the check alone answer
  # or decline these questions: better on our sets, worse on LongMemEval (89 of 470 wrongly declined).
  aggregation_check:
    enabled: false
    mode: rescue
    # compute: for time-between and ordering questions whose every event is supported at compute_min_support by a
    # distinct memory, return `computed_answer` (days between, or the order) worked out from those memories' dates,
    # with the working in the receipt. Counting is never computed. Never changes the answer-or-decline decision.
    compute: true
    compute_min_support: 0.9
    model: cross-encoder/nli-deberta-v3-base   # 184M parameters; nli-deberta-v3-xsmall is ~4x faster and weaker
    threshold: 0.5         # P(entailment) a presupposed event needs from its best memory
    memories: 10           # how many ranked memories are read
    max_length: 256
    device: null
  # Re-ranker / deep recall (features/reranker.py): a small cross-encoder (22M parameters, not an
  # LLM) reads the question and each of the `candidates` memories after the first `keep` together and
  # reorders them; `context` also reads each memory after the message before it (the better score
  # counts). It runs after recall has decided to answer, so it cannot change an answer into a decline.
  # Measured on LoCoMo dev (eval/results/retrieval_fixes), with the second pass: served evidence
  # recall@10 0.706 -> 0.748, multi-hop 0.376 -> 0.458, temporal 0.817 -> 0.865, single-hop
  # 0.821 -> 0.852, open-domain 0.280 -> 0.286; declines and traps unchanged; our dev set and the
  # Gemini batches unchanged. Cost (Apple M4 CPU, conv-44): median recall 140 ms -> ~610 ms
  # (~450 ms on the Mac GPU). So by default it runs only for recalls that ask for it (`deep: true`
  # in /memory/recall, `mem.recall(..., deep=True)`); `enabled: true` runs it on every recall.
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 50
    keep: 3
    context: true
    context_gap_minutes: 60
    context_max_words: null    # read with the previous message only messages up to this many words (null: all)
    max_length: 256
    threads: null         # torch CPU threads for this model (null = torch default)
    device: null          # null = GPU if available (cuda / Apple mps), else CPU
    preload: true         # load at startup (one ~90 MB download on first start) so deep recalls are not slow
    # auto: deep recall without being asked for questions that look spread out ("what kinds of...",
    # "what has she done...", "X and Y", "in common"). LoCoMo dev: multi-hop 0.375 -> 0.400 (deep on
    # every recall: 0.444), mean recall 207 -> 279 ms. Off: the pattern misses most such questions.
    auto: false

  # Second pass: the first `keep` results stay exactly as ranked (so does any later one the reader
  # found the answer in). Of the places after them, `search` go to the memories closest in meaning to
  # the question and the top results together (finds a second fact that shares few words with the
  # question), then come the messages stored right around the best-ranked result (`neighbours` on
  # each side, within `max_gap_minutes` of it: the answer is often one line away), then the rest.
  # It runs after recall has decided to answer, so it cannot change an answer into a decline or back.
  # Measured (eval/results/retrieval_fixes, with calculation_questions): evidence recall@10 of what
  # is served 0.649 -> 0.706 on LoCoMo dev (multi-hop 0.362 -> 0.376, temporal 0.782 -> 0.817,
  # single-hop 0.734 -> 0.821, open-domain 0.292 -> 0.280 = half a question of 44) and 0.606 -> 0.667
  # on conv-44; first-answer accuracy and trap declines unchanged everywhere (by construction).
  # Cost: about 20 ms per recall of more than `keep` results. No effect when limit <= keep.
  second_pass:
    enabled: true
    keep: 5
    search: 2
    seeds: 3              # top results whose meaning is added to the question for the second search
    weight: 0.5           # how much they count next to the question
    neighbours: 2
    max_gap_minutes: 60
  # Implicit facts: ATOMIC 2020 commonsense proposes what a memory implies; an NLI model verifies
  # it (backend/brain/features/implicit.py; build the index with backend/tools/build_inference_rules).
  # OFF: measured precision of verified inferences on eval/data/implicit (119 sentences, 71
  # inferences, labelled) was 51% at question-time and 71% at store-time settings, below the 90%
  # bar for shipping on. The NLI verifier accepts likely-but-not-entailed consequences.
  implicit:
    enabled: false
    rules_dir: inference_rules
    rule_embedder: sentence-transformers/all-MiniLM-L6-v2
    nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
    max_patterns: 3
    pattern_similarity: 0.55
    store_pattern_similarity: 0.7
    store_min_entailment: 0.95
    question_min_entailment: 0.9
    max_restatement_similarity: 0.8
  # Decline questions about a named person ("Where does Morgan work?") whom no memory mentions
  # and who never spoke, instead of returning the user's own facts (found by the memory fuzzer).
  unknown_person_check:
    enabled: true
  # Updates beat originals, without needing an extracted fact: a later memory that announces a
  # change ("rescheduled to", "instead", "update:", "moving X from A to B") about the same thing
  # as a higher-ranked earlier one is ranked just above it (backend/brain/memory/updates.py).
  # Measured with user_perspective below (MiniLM embedder): dev hit@1 0.86 -> 0.93; Gemini batch 1
  # (development data, guards tuned on it) 0.76 -> 0.88; LoCoMo dev unchanged (few change cues);
  # legacy retention 7/8 unchanged. Unseen Gemini batch 2: hit@1 0.80 with or without (no gain;
  # one more trap declined). Quantity ("dropped retainer to 4000") and purchase ("returned ... and
  # bought") cues added on batch 2 (development); LoCoMo dev unchanged. To be confirmed on batch 3.
  updates:
    enabled: true
  # Questions about the user in the third person ("Which hospital does she work at?", "the
  # user's job") are searched as first person ("do I work", "my job") unless they name someone
  # else first. The answer check still reads the question as asked.
  user_perspective:
    enabled: true
  # Updates without a cue word: the answer checker reads the top `read` served memories; when two
  # about the same thing give different answers, the later is served first (the earlier when the
  # question asks "originally", "previously", ...). memory/updates.py resolve_answer_conflicts.
  answer_conflicts:
    enabled: true
    read: 3
    # The recall's top-level `answer`: "confidence" = the reader's most confident accepted span (a
    # later, different answer found by this check is added as answer.later_answer); "conflict" = the
    # later answer. LoCoMo dev answer token-F1 0.339 (conflict) -> 0.375 (confidence); dev set and
    # Gemini batches identical either way (eval/results/retrieval_fixes).
    best_answer: confidence
    # First-person questions about now ("Where do I live?"): a later answer replaces the reader's most confident one
    # only if it is stated about the user and its margin is at least this (acceptance is answer_check's threshold,
    # much lower). Set on development data (eval/results/update_set): -0.5 keeps "found a flat in pune" (-0.34) and
    # rejects "I moved to Mumbai" for "Where do I work?" (-1.10).
    override_min_margin: -0.5
  # Fact half-lives: every fact in a recall receipt carries the probability it is still true,
  # from how often this user's facts of the same kind were replaced (exponential survival model,
  # Gamma prior: prior_events replacements per prior_days; see backend/brain/memory/freshness.py).
  freshness:
    enabled: true
    prior_events: 1.0
    prior_days: 365.0
  # Recall-time distillation: when feedback confirms a memory answered a question, similar later
  # questions (embedding cosine >= min_similarity) always consider that memory. Ranking unchanged.
  distillation:
    enabled: true
    min_similarity: 0.9
  # Runtime override of the learned relevance threshold (null = the fitted ranker model's threshold).
  abstain_threshold: null
  # A decline (status ABSTAINED) still returns the ranked results, marked low-confidence (answer null),
  # instead of none. The decision itself is unchanged. Per request: keep_on_decline (true/false);
  # this is the default for requests that omit it. Leave off: callers that ignore `status` would
  # answer from low-confidence results.
  keep_results_on_decline: false


# ============================================================================
# Facts: learned extractor (phase6/) — a small token tagger distilled offline from an
# open-weight teacher LLM; complements the rule grammar. No LLM at runtime. Off until a
# trained model is installed under the storage root and its evaluation justifies it.
# ============================================================================
facts:
  learned_extractor:
    enabled: false
    path: models/fact_extractor

# ============================================================================
# HTTP API
# ============================================================================
api:
  cors_allowed_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]   # env CORS_ALLOWED_ORIGINS overrides
  writes_per_second_per_user: 50   # store requests above this get HTTP 429
  reads_per_second_per_user: 20    # recalls above this get HTTP 429 (a deep recall counts as 4)
  max_request_bytes: 1048576       # larger request bodies get HTTP 413
  max_import_bytes: 10485760       # POST /memory/import and /memory/store_batch
  max_import_items: 5000           # memories per import; one import per user at a time
  max_batch_items: 100             # messages per POST /memory/store_batch (one bulk write per user at a time)
  max_metadata_bytes: 16384        # a memory's metadata, as JSON

# ============================================================================
# Background jobs (run inside the API process)
# ============================================================================
# Learning from use (backend/brain/memory_ranking/self_improve.py): every workers.learning_hours the
# ranker is refitted from the feedback this deployment collected (POST /memory/feedback, mem.used()).
# A share of the feedback is set aside, and the new fit replaces the model in use only if it ranks
# better on that share and does not decline answerable questions more often. The replaced model is
# kept (POST /internal/learning/rollback); every attempt is logged (GET /internal/learning).
# Nothing happens without feedback, and nothing leaves the server.
learning:
  enabled: true
  min_recalls: 30      # recalls with feedback before the first attempt
  min_new: 20          # new recalls with feedback before trying again
  holdout: 0.2         # share set aside to judge a new fit
  min_holdout: 6       # answerable held-out recalls needed to judge at all
  # The answer check's decline threshold, learned from feedback (backend/brain/features/answer_check_learning.py).
  # Off by default: where most questions are answerable it answers more of them, which also answers some
  # questions that should have been declined. Feedback on declined recalls needs keep_on_decline.
  answer_check:
    enabled: false
    wrong_answer_cost: 3       # a wrong answer counts as this many refusals
    min_answerable: 50         # recalls whose feedback used a memory the answer check read
    min_unanswerable: 20       # recalls whose feedback used nothing ("none_used")
    min_new: 20                # new labelled recalls before trying again

workers:
  enabled: true
  active_user_days: 30           # jobs only process users with memories this recent
  state_inference_minutes: 15    # world-state from fact slots + schema shares
  prediction_minutes: 30         # Markov next-topic prediction
  replay_hours: 6                # reflections from long-term facts
  forgetting_hours: 24           # memory forgetting policy (below)
  learning_hours: 24             # refit the ranker from feedback (`learning` below)
  forgetting:
    enabled: true
    delete_max_importance: 3.0   # delete never-recalled memories at or below this importance ...
    delete_min_age_days: 7       # ... once older than this
    archive_max_importance: 5.0  # archive (move to archive DB) at or below this importance ...
    archive_min_age_days: 30     # ... once older than this
    protect_min_importance: 8.0  # never forget memories at or above this importance
