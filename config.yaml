# ============================================================================
# Recallix Configuration
# ============================================================================
# This is the single source of truth for all model and infrastructure settings.
# Edit this file to switch between providers, models, or tune performance.
#
# MODELS:
#   - Set "provider" to choose your LLM backend.
#   - Under each provider, specify the model names you want to use.
#   - You can use ANY Ollama model (e.g. "phi3", "gemma2:2b", "codellama")
#     or ANY API provider by adding your key below.
#
# To add a new Ollama model, just change the name:
#   smart_model: "deepseek-r1:8b"
#
# To switch to an API provider, change provider and fill in the key:
#   provider: "openai"
# ============================================================================

models:
  # The memory pipeline (store/recall/workers) makes NO LLM calls; it only needs
  # embeddings. `provider` is used only by scripts that drive LLM agents
  # (e.g. scratch/multi_agent_benchmark.py).
  # Which provider to use: "ollama", "openai", "anthropic", "groq", "nvidia", or "custom"
  provider: "nvidia"
  # Embeddings: "local" (in-process sentence-transformers, fully offline; needs requirements-local.txt),
  # "ollama", or any OpenAI-compatible provider below. The shipped ranking, answer-check and trust
  # fits were made with the local default model; with another model, refit (eval/README.md).
  # Env RECALLIX_EMBEDDING_PROVIDER overrides.
  embedding_provider: "local"

  # --- Local (in-process, offline) ---
  local:
    embedding_model: "BAAI/bge-small-en-v1.5"   # 384-d, ~130 MB; chosen on dev data (eval/results/embedder_comparison)

  # --- Ollama (Local) ---
  # Any model pulled via `ollama pull <name>` works here.
  # Audited defaults: llama3.1:8b, mistral:latest, mxbai-embed-large
  ollama:
    base_url: "http://localhost:11434"
    fast_model: "mistral:latest"        # Used for: compression, summarization, intent detection
    smart_model: "llama3.1:8b"          # Used for: reasoning, reflection, schema discovery
    embedding_model: "mxbai-embed-large" # Used for: 128D vector embeddings

  # --- OpenAI (API) ---
  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    fast_model: "gpt-4o-mini"
    smart_model: "gpt-4o"
    embedding_model: "text-embedding-3-small"

  # --- Anthropic (API) ---
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com"
    fast_model: "claude-3-5-haiku-20241022"
    smart_model: "claude-sonnet-4-20250514"

  # --- Groq (API) ---
  groq:
    api_key: "${GROQ_API_KEY}"
    base_url: "https://api.groq.com/openai/v1"
    fast_model: "llama-3.1-8b-instant"
    smart_model: "llama-3.3-70b-versatile"

  # --- NVIDIA (API) ---
  nvidia:
    api_key: "${NVIDIA_API_KEY}"
    base_url: "https://integrate.api.nvidia.com/v1"
    fast_model: "nvidia/nemotron-nano-12b-v2-vl"
    smart_model: "nvidia/nvidia-nemotron-nano-9b-v2"
    embedding_model: "nvidia/nv-embedqa-e5-v5"

  # --- Custom (Any OpenAI-compatible API) ---
  custom:
    api_key: ""
    base_url: ""                         # e.g. "https://your-server.com/v1"
    fast_model: ""
    smart_model: ""
    embedding_model: ""

# ============================================================================
# Storage (SQLite databases, API key hashes, learned model files)
# ============================================================================
storage:
  root: "backend/storage"   # relative to the project root; env RECALLIX_STORAGE_ROOT overrides

# ============================================================================
# Vector engine (C++ service, backend/infra_cpp)
# The shared secret is NOT configured here: set RECALLIX_INTERNAL_KEY in the
# environment / .env (python -m backend.tools.setup_env creates one).
# ============================================================================
engine:
  url: "http://127.0.0.1:8080"   # env RECALLIX_ENGINE_URL overrides
  timeout_seconds: 10
  bulk_batch_size: 1000          # vectors per request when rebuilding an index

# ============================================================================
# HNSW Index Parameters (pushed to the engine at startup; changing M or
# ef_construction triggers a rebuild of every index on next start)
# ============================================================================
hnsw:
  M: 16                   # Max neighbors per node per layer
  ef_construction: 100    # Construction beam width (higher = better graph, slower build)
  ef_search: 50           # Search beam width (higher = better recall, slower search)

# ============================================================================
# Memory tiers
# ============================================================================
memory:
  long_term_min_importance: 8.0   # importance (1-10) at which a memory is promoted to long-term
  decay_unit_hours: 24            # time unit of the Ebbinghaus stability for long-term facts
  sensory_ttl_seconds: 60
  sensory_size: 10
  working_window: 15              # messages kept in working memory per user

# ============================================================================
# Recall
# ============================================================================
recall:
  candidate_pool: 200        # max candidates from each of lexical and vector search
  backfill_per_query: 50     # max legacy rows embedded lazily per query
  # Abstention: recall returns nothing when the best match's relevance is below a threshold.
  # The fitter sets it so that at most this share of answerable dev questions is refused
  # (a wrongly refused question is treated as costlier than a missed trap; raise it to refuse more).
  max_false_abstain_rate: 0.05
  # Answer-level check (needs requirements-local.txt): a small extractive QA model trained on
  # SQuAD 2.0 reads the served memories; recall abstains if none of them contains an answer.
  # No LLM. threshold: null = value chosen on dev data for this model (answer_check.default.json),
  # else the model's own answer/no-answer boundary.
  answer_check:
    enabled: true
    model: "deepset/roberta-base-squad2"   # chosen on dev data (eval/run_eval.py --fit-answer-check); must match answer_check.default.json
    max_length: 384
    stride: 128
    max_answer_tokens: 30
    threshold: null
    rerank: true       # serve memories in which an answer was found first (dev: LoCoMo hit@1 0.29 -> 0.37)
    # Read all-lowercase (texting-style) memories with sentence case restored; text with any capital
    # is read unchanged (features/answer_check.py restore_case). OFF by default (owner's decision:
    # wrong answers cost more than refusals). Gemini batches 1-2 (development): right memory recognised
    # 44/50 -> 49/50. Unseen batch 3: +1 answered, but traps wrongly answered 0/10 -> 2/10.
    restore_case: false
    # Read each memory without clauses whose subject is another person the question does not ask
    # about ("roommate liam failed his organic chemistry midterm" cannot answer "What is my major?").
    # A memory entirely about someone else then cannot answer (memory/updates.py without_other_people).
    other_people:
      enabled: true
    # "Who said what": when a question names one of the speakers, a memory counts as answering
    # only if the reader finds the answer more strongly for that person than for every other
    # speaker (contrast > min_contrast). LoCoMo dev (999 questions): adversarial questions
    # declined 23.2% -> 28.3%, answerable wrongly declined 7.48% -> 7.61%, recall@10 unchanged.
    subject_contrast:
      enabled: true
      min_contrast: 0.0      # principled default: support the asked person more than anyone else
      max_alternatives: 3    # other speakers to compare against (one reader pass each)
  # Questions as keys: at store time each extracted fact yields the questions it answers
  # ("Where do I live?"), embedded and kept with the memory; at recall a memory's meaning score
  # is the better of question-vs-memory and question-vs-its-questions. Measured: no effect on
  # our dev set (hit@1 0.86 -> 0.86) or LoCoMo dev (recall@10 0.621 -> 0.622) — those contain
  # few extractable facts. Off by default; may help fact-heavy deployments (verify with memtest).
  question_keys:
    enabled: false
  # Neighbour context: a short message (<= max_words) also gets a search key made of the `previous`
  # message(s) before it plus itself, so "saw doc miller" can be found by a question about the
  # shoulder injury mentioned just before. One extra embedding per short message; the memory's own
  # text and vector are unchanged (memory/manager.py _context_before).
  # Measured on dev data (bge-small): every message with the 2 before it -> LoCoMo dev recall@10
  # 0.648 -> 0.665, answerable wrongly declined 7.0% -> 6.6%, Gemini batches hit@1 0.84 -> 0.83,
  # their traps declined 28/30 -> 30/30. Short messages only / 1 before: no change. Off by default
  # (one extra embedding per stored message); to try it: enabled: true, max_words: 100000, previous: 2.
  neighbour_context:
    enabled: false
    max_words: 12
    previous: 1
  # Implicit facts: ATOMIC 2020 commonsense proposes what a memory implies; an NLI model verifies
  # it (backend/brain/features/implicit.py; build the index with backend/tools/build_inference_rules).
  # OFF: measured precision of verified inferences on eval/data/implicit (119 sentences, 71
  # inferences, labelled) was 51% at question-time and 71% at store-time settings, below the 90%
  # bar for shipping on. The NLI verifier accepts likely-but-not-entailed consequences.
  implicit:
    enabled: false
    rules_dir: inference_rules
    rule_embedder: sentence-transformers/all-MiniLM-L6-v2
    nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
    max_patterns: 3
    pattern_similarity: 0.55
    store_pattern_similarity: 0.7
    store_min_entailment: 0.95
    question_min_entailment: 0.9
    max_restatement_similarity: 0.8
  # Decline questions about a named person ("Where does Morgan work?") whom no memory mentions
  # and who never spoke, instead of returning the user's own facts (found by the memory fuzzer).
  unknown_person_check:
    enabled: true
  # Updates beat originals, without needing an extracted fact: a later memory that announces a
  # change ("rescheduled to", "instead", "update:", "moving X from A to B") about the same thing
  # as a higher-ranked earlier one is ranked just above it (backend/brain/memory/updates.py).
  # Measured with user_perspective below (MiniLM embedder): dev hit@1 0.86 -> 0.93; Gemini batch 1
  # (development data, guards tuned on it) 0.76 -> 0.88; LoCoMo dev unchanged (few change cues);
  # legacy retention 7/8 unchanged. Unseen Gemini batch 2: hit@1 0.80 with or without (no gain;
  # one more trap declined). Quantity ("dropped retainer to 4000") and purchase ("returned ... and
  # bought") cues added on batch 2 (development); LoCoMo dev unchanged. To be confirmed on batch 3.
  updates:
    enabled: true
  # Questions about the user in the third person ("Which hospital does she work at?", "the
  # user's job") are searched as first person ("do I work", "my job") unless they name someone
  # else first. The answer check still reads the question as asked.
  user_perspective:
    enabled: true
  # Updates without a cue word: the answer checker reads the top `read` served memories; when two
  # about the same thing give different answers, the later is served first (the earlier when the
  # question asks "originally", "previously", ...). memory/updates.py resolve_answer_conflicts.
  answer_conflicts:
    enabled: true
    read: 3
  # Fact half-lives: every fact in a recall receipt carries the probability it is still true,
  # from how often this user's facts of the same kind were replaced (exponential survival model,
  # Gamma prior: prior_events replacements per prior_days; see backend/brain/memory/freshness.py).
  freshness:
    enabled: true
    prior_events: 1.0
    prior_days: 365.0
  # Recall-time distillation: when feedback confirms a memory answered a question, similar later
  # questions (embedding cosine >= min_similarity) always consider that memory. Ranking unchanged.
  distillation:
    enabled: true
    min_similarity: 0.9
  # Runtime override of the learned relevance threshold (null = the fitted ranker model's threshold).
  abstain_threshold: null


# ============================================================================
# Facts: learned extractor (phase6/) — a small token tagger distilled offline from an
# open-weight teacher LLM; complements the rule grammar. No LLM at runtime. Off until a
# trained model is installed under the storage root and its evaluation justifies it.
# ============================================================================
facts:
  learned_extractor:
    enabled: false
    path: models/fact_extractor

# ============================================================================
# HTTP API
# ============================================================================
api:
  cors_allowed_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]   # env CORS_ALLOWED_ORIGINS overrides
  writes_per_second_per_user: 50   # store requests above this get HTTP 429

# ============================================================================
# Background jobs (run inside the API process)
# ============================================================================
workers:
  enabled: true
  active_user_days: 30           # jobs only process users with memories this recent
  state_inference_minutes: 15    # world-state from fact slots + schema shares
  prediction_minutes: 30         # Markov next-topic prediction
  replay_hours: 6                # reflections from long-term facts
  forgetting_hours: 24           # memory forgetting policy (below)
  forgetting:
    enabled: true
    delete_max_importance: 3.0   # delete never-recalled memories at or below this importance ...
    delete_min_age_days: 7       # ... once older than this
    archive_max_importance: 5.0  # archive (move to archive DB) at or below this importance ...
    archive_min_age_days: 30     # ... once older than this
    protect_min_importance: 8.0  # never forget memories at or above this importance
